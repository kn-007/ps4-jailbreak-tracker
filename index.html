<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png" type="image/png">
<title>PS4 Jailbreak Tracker</title>
<style>
:root{
 --bg:#03070d;--surface:#071321;--surface2:#0a192b;--line:#173552;--text:#f4f7ff;--muted:#91a8c7;
 --blue:#178cff;--blue2:#72baff;--green:#25e59a;--yellow:#ffd21e;--purple:#b66cff;--red:#ff315f;
}
html[data-theme="black"] .hero-shade{background:linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.16) 100%);}
html[data-theme="black"]{
 --bg:#000;--surface:#08090b;--surface2:#101114;--line:#24282e;--text:#f2f2f4;--muted:#989ba3;
 --blue:#e2e5eb;--blue2:#fff;--green:#35d49a;--yellow:#e9d16a;--purple:#bda2ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
a{text-decoration:none;color:inherit}button,input{font:inherit}button{border:0;background:none;color:inherit}
.app{max-width:1080px;margin:auto;min-height:100vh;padding-bottom:64px;background:var(--bg)}
.hero{position:relative;background:#06101c;border-bottom:1px solid var(--line);overflow:hidden}
.hero-image{display:block;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;background:#06101c}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04) 45%,rgba(0,0,0,.66) 100%),linear-gradient(90deg,rgba(0,0,0,.12),transparent 55%);pointer-events:none}
.hero-brand{display:none}
.hero-brand h1{margin:0;font-size:clamp(17px,3vw,24px);line-height:1.05;letter-spacing:-.35px;font-weight:800}
.hero-brand h1 span{color:var(--blue2)}
.hero-brand p{margin:4px 0 0;color:#9aabc3;font-size:11px;font-weight:600}
.theme-btn{position:absolute;right:18px;top:34px;z-index:3;width:46px;height:46px;border-radius:15px;background:rgba(3,9,17,.72);border:1px solid rgba(120,170,230,.28);display:grid;place-items:center;backdrop-filter:blur(8px)}
.theme-btn svg{width:23px;height:23px;stroke:var(--blue2);fill:none;stroke-width:2}
.tabs{display:none}
.content{padding:0 22px}.section{margin-top:18px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}.section-title{display:flex;align-items:center;gap:10px}.section-title svg{width:27px;height:27px;stroke:var(--blue);fill:none;stroke-width:2}.section-title h2{font-size:21px;margin:0;font-weight:850}.section-title small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:600}.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);color:var(--blue2);font-size:11px;font-weight:850}.pill.green{color:var(--green);border-color:rgba(37,229,154,.35);background:rgba(37,229,154,.07)}.pill.purple{color:var(--purple);border-color:rgba(182,108,255,.45)}
.cards{display:grid;gap:2px}.card{position:relative;min-height:112px;display:grid;grid-template-columns:56px 1fr 22px;gap:10px;align-items:center;padding:13px 12px 13px 10px;background:linear-gradient(90deg,rgba(8,18,32,.98),rgba(6,15,27,.94));border:1px solid var(--line);border-radius:17px;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}.card.new:before{background:var(--red)}.card.advance:before{background:var(--purple)}
.card-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:rgba(17,77,145,.28);border:1px solid rgba(66,137,219,.18)}.card-icon svg{width:25px;height:25px;stroke:var(--blue2);fill:none;stroke-width:2}.advance .card-icon{background:rgba(133,63,214,.18);border-color:rgba(182,108,255,.22)}.advance .card-icon svg{stroke:var(--purple)}
.card-body{min-width:0}.card-title{font-size:15px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:42px}.card-summary{font-size:12.5px;line-height:1.25;color:#91a8c7;margin-top:3px;padding-right:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:10.5px;padding:4px 8px;border-radius:999px;background:#0b1c31;border:1px solid #173b62;color:#a9c7ed}.card-time{position:absolute;right:35px;top:11px;font-size:10.5px;color:#8ea6c7;white-space:nowrap}.card-arrow{font-size:26px;color:#7fa2cc}.label{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:900;padding:4px 7px;border-radius:6px;margin-bottom:5px}.label.new{background:#ff174f;color:white}.label.radar{border:1px solid #e0aa00;color:#ffd21e}.label.advance{border:1px solid #a75cff;color:#c992ff}
.empty{padding:25px 18px;text-align:center;border:1px dashed var(--line);border-radius:17px;color:var(--muted);background:rgba(8,15,25,.7)}.empty strong{display:block;color:var(--text);margin-bottom:5px}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(1080px,100%);height:54px;background:rgba(2,6,11,.97);border-top:1px solid var(--line);display:grid;place-items:center;padding:7px 12px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
.footer-name{font-size:12px;font-weight:750;letter-spacing:.2px;color:#7f93ad}.footer-name span{color:var(--blue2)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;padding:10px 15px;border-radius:999px;background:#101923;border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.theme-btn{right:12px;top:34px}.content{padding:0 12px}.section{margin-top:15px}.card{grid-template-columns:50px 1fr 18px;padding:12px 9px 12px 8px}.card-icon{width:44px;height:44px;border-radius:14px}.card-icon svg{width:23px;height:23px}}</style>
</head>
