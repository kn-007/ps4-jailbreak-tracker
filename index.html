<!doctype html>

<title>PS4 Jailbreak Tracker V5</title>

<style>
:root{--bg:#080b10;--panel:#101620;--panel2:#151d28;--text:#f4f7fb;--muted:#8f9baa;--line:#222d3b;--green:#5ee6b3;--yellow:#ffd166;--red:#ff6b6b;--blue:#6ea8fe}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 80% -10%,#182234 0,#080b10 35%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:62px}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{max-width:1050px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(8,11,16,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top{padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px}
.brand span:first-child{font-size:26px}
.version{font-size:11px;color:var(--muted);border:1px solid #283444;padding:3px 6px;border-radius:999px}
.sub{color:var(--muted);margin-top:2px}
.toolbar{display:flex;gap:9px;margin:13px 0;overflow:auto}
.search{flex:1;min-width:210px;background:#0d131c;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 13px;outline:none}
.search:focus{border-color:#41546e}
.chip,.select,.action{background:#0d131c;border:1px solid var(--line);color:#dfe7ef;border-radius:11px;padding:10px 12px;white-space:nowrap}
.action{font-weight:700}
.action.primary{border-color:#376854;background:#10231c;color:#aaf0d3}
main{padding:22px 0 70px}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}
.heroCard{background:linear-gradient(145deg,#152033,#0f151e);border:1px solid #2a3a50;border-radius:18px;padding:20px}
.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:28px;line-height:1.12;margin:7px 0}
.hero p{color:#b9c4d0;margin:0}
.pulse{margin-top:16px;display:flex;align-items:center;gap:9px}
.pulseDot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(94,230,179,.09)}
.stat{display:flex;flex-direction:column;justify-content:center}
.big{font-size:34px;font-weight:850}
.muted{color:var(--muted);font-size:13px}
h2{font-size:20px;margin:28px 0 12px}
.fwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fw{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}
.fwtop{display:flex;justify-content:space-between;align-items:center}
.fwname{font-size:20px;font-weight:850}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;color:#b8c4d1}
.fwdesc{color:var(--muted);margin-top:8px}
.bar{height:5px;background:#202a37;border-radius:9px;margin-top:12px;overflow:hidden}
.fill{height:100%;border-radius:9px;background:var(--green)}
.fill.y{background:var(--yellow)}
.fill.r{background:var(--red)}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:3px}
.filters button.active{border-color:#49627f;background:#172231}
.news{display:grid;gap:11px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.item.new{border-color:#285d4d;box-shadow:0 0 0 1px rgba(94,230,179,.06)}
.item.radar{border-color:#594d27;box-shadow:0 0 0 1px rgba(255,209,102,.05)}
.itemhead{display:flex;justify-content:space-between;gap:10px}
.meta{color:var(--muted);font-size:12px}
.newtag{color:#08110d;background:var(--green);font-weight:850;padding:3px 7px;border-radius:999px;font-size:10px}
.radartag{color:#171207;background:var(--yellow);font-weight:850;padding:3px 7px;border-radius:999px;font-size:10px}
.title{font-size:17px;font-weight:800;margin:8px 0 5px}
.desc{color:#c1cad5}
.tags{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;color:#b8c5d2;border:1px solid var(--line);padding:4px 7px;border-radius:999px}
.source{display:inline-block;margin-top:12px;color:#9fc1ff;text-decoration:none}
.empty{color:var(--muted);padding:24px 4px;text-align:center}
.timeline{border-left:1px solid #2b3746;margin:0 0 0 8px;padding-left:20px}
.tl{position:relative;margin-bottom:20px}
.tl:before{content:"";position:absolute;left:-25px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #101620}
.tl strong{display:block}
.tl small{color:var(--muted)}
.notice{margin-top:14px;padding:13px 14px;border:1px solid #29384b;background:#0d141e;border-radius:14px;color:#b8c4d1;font-size:13px}
.notice b{color:#e9f0f7}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(8,11,16,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px max(16px,env(safe-area-inset-left)) max(9px,env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}
.bottom span{font-size:12px;color:var(--muted)}
@media(max-width:700px){
.hero{grid-template-columns:1fr}
.fwgrid{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:25px}
.toolbar{align-items:center}
.select{max-width:125px}
}
@media(min-width:701px){
.news{grid-template-columns:1fr 1fr}
}
</style>
</head>
