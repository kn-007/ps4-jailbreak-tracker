<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PS4 14.00 Radar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header limpo -->
    <header class="header">
      <div class="header-left">
        <h1>PS4 14.00</h1>
        <span class="status" id="status">Monitorando</span>
      </div>
      <div class="header-right">
        <span class="last-update" id="last-update">—</span>
      </div>
    </header>

    <!-- Filtros -->
    <nav class="tabs">
      <button class="tab active" data-filter="all">Todos</button>
      <button class="tab" data-filter="high">Relevantes</button>
      <button class="tab" data-filter="webkit">WebKit</button>
      <button class="tab" data-filter="kernel">Kernel</button>
    </nav>

    <!-- Lista de resultados -->
    <main class="list" id="list">
      <!-- Os cards serão inseridos aqui via JS -->
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
