html[data-theme="black"] .hero-art{
  filter:grayscale(.82) brightness(.55) contrast(1.08);
}
.hero-top{
  position:absolute;
  top:22px;left:22px;right:22px;
  display:flex;align-items:flex-start;justify-content:space-between;
  z-index:2;
}
.brand{margin-top:108px;max-width:300px}
.brand h1{font-size:30px;line-height:1.02;margin:0;font-weight:800;letter-spacing:-.7px}
.brand h1 span{color:var(--blue2)}
.brand p{margin:7px 0 0;color:#9db0cc;font-size:17px;font-weight:600}
.hero-actions{display:flex;gap:8px}
.icon-btn{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;
  background:rgba(4,10,19,.58);
  border:1px solid rgba(120,170,230,.25);
  backdrop-filter:blur(8px);
}
.icon-btn svg{width:22px;height:22px;stroke:var(--blue2);fill:none;stroke-width:2.3}

.tabs{
  position:absolute;left:22px;right:22px;bottom:14px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;z-index:3
}
.tab{
  min-height:66px;border-radius:20px;
  background:rgba(5,13,24,.86);
  border:1px solid #1b3555;
  display:flex;align-items:center;justify-content:center;gap:12px;
  transition:.18s ease;
}
.tab.active{background:linear-gradient(135deg,#087cf0,#1669cf);border-color:#4aa6ff;box-shadow:0 7px 24px rgba(0,126,255,.24)}
.tab svg{width:28px;height:28px;stroke:var(--blue2);fill:none;stroke-width:2}
.tab.active svg{stroke:#fff}
.tab-main{font-size:17px;font-weight:800}
.tab-sub{display:block;font-size:12px;color:#8da7c9;margin-top:3px;font-weight:600}
.tab.active .tab-sub{color:#d8ecff}

.content{padding:0 22px}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}
.section-title{display:flex;align-items:center;gap:10px}
.section-title svg{width:28px;height:28px;stroke:var(--blue);fill:none;stroke-width:2}
.section-title h2{font-size:21px;margin:0;font-weight:800}
.section-title small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:600}
.badge{font-size:12px;color:var(--muted)}
.pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--blue2);font-size:12px;font-weight:800}
.pill.green{color:var(--green);border-color:rgba(37,229,154,.35);background:rgba(37,229,154,.07)}
.pill.purple{color:var(--purple);border-color:rgba(182,108,255,.45)}

.cards{display:grid;gap:2px}
.card{
  position:relative;min-height:112px;
  display:grid;grid-template-columns:68px 1fr 26px;gap:10px;
  align-items:center;
  padding:14px 14px 14px 12px;
  background:linear-gradient(90deg,rgba(8,18,32,.98),rgba(6,15,27,.92));
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
.card.new::before{background:var(--danger)}
.card.advance::before{background:var(--purple)}
.card-icon{
  width:54px;height:54px;border-radius:17px;
  display:grid;place-items:center;
  background:rgba(17,77,145,.28);
  border:1px solid rgba(66,137,219,.18);
}
.card-icon svg{width:29px;height:29px;stroke:var(--blue2);fill:none;stroke-width:2}
.advance .card-icon{background:rgba(133,63,214,.18);border-color:rgba(182,108,255,.22)}
.advance .card-icon svg{stroke:var(--purple)}
.card-body{min-width:0}
.card-title{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-summary{font-size:13px;line-height:1.25;color:#91a8c7;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:11px;padding:5px 9px;border-radius:999px;background:#0b1c31;border:1px solid #173b62;color:#a9c7ed}
.card-arrow{font-size:26px;color:#7fa2cc}
.label{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;padding:4px 7px;border-radius:6px;margin-bottom:5px}
.label.new{background:#ff174f;color:white}
.label.radar{border:1px solid #e0aa00;color:#ffd21e}
.label.advance{border:1px solid #a75cff;color:#c992ff}

.empty{
  padding:28px 18px;text-align:center;
  border:1px dashed var(--line2);border-radius:17px;
  color:var(--muted);background:rgba(8,15,25,.7)
}
.empty strong{display:block;color:var(--text);margin-bottom:5px}

.bottom{
  position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);
  width:min(1080px,100%);height:78px;
  background:rgba(2,6,11,.96);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter:blur(14px)
}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8298b7;font-size:11px;font-weight:700}
.nav.active{color:var(--blue2)}
.nav svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2}
.nav.active svg{filter:drop-shadow(0 0 8px rgba(36,145,255,.45))}

.toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);
  opacity:0;pointer-events:none;z-index:30;
  padding:10px 15px;border-radius:999px;
  background:#101923;border:1px solid var(--line2);color:var(--text);
  font-size:13px;font-weight:700;transition:.2s
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:620px){
  .hero{height:400px}
  .brand{margin-top:104px}
  .brand h1{font-size:26px}
  .tabs{left:12px;right:12px;gap:7px}
  .tab{min-height:62px;border-radius:18px;gap:8px}
  .tab svg{width:24px;height:24px}
  .tab-main{font-size:15px}
  .content{padding:0 12px}
  .section{margin-top:15px}
  .card{grid-template-columns:54px 1fr 18px;padding:12px 10px 12px 8px}
  .card-icon{width:47px;height:47px;border-radius:14px}
  .card-icon svg{width:25px;height:25px}
}
</style>
</head>

<body>
<div class="app">

  <header class="hero">
    <div class="hero-art"></div>

    <div class="hero-top">
      <div class="brand">
        <h1>PS4 <span>Jailbreak</span><br>Tracker</h1>
        <p>Monitoramento PS4 • firmware 14.00</p>
      </div>

      <div class="hero-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Pesquisar">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="radar">
        <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M7 13a5 5 0 0 1 10 0"/><circle cx="12" cy="13" r="1.5"/><path d="M12 13 18 7"/></svg>
        <div><div class="tab-main">Radar</div><span class="tab-sub">14.00</span></div>
      </button>
      <button class="tab" data-tab="ps4">
        <svg viewBox="0 0 24 24"><path d="M8.5 18.5 6 7.5l3-2 3 2 3-2 3 2-2.5 11"/><path d="M9 10h6"/></svg>
        <div><div class="tab-main">PS4</div><span class="tab-sub">Tudo</span></div>
      </button>
      <button class="tab" data-tab="advance">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/><path d="m17 6 1 3"/></svg>
        <div><div class="tab-main">14.00</div><span class="tab-sub">Avanços</span></div>
      </button>
    </div>
  </header>

  <main class="content">

    <section class="section" id="radarSection">
      <div class="section-head">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M7 13a5 5 0 0 1 10 0"/><circle cx="12" cy="13" r="1.5"/><path d="M12 13 18 7"/></svg>
          <div><h2>Radar</h2><small>Resultados automáticos do GitHub • PS4 14.00</small></div>
        </div>
        <span class="pill green" id="radarStatus">● ATIVO</span>
      </div>
      <div class="cards" id="radarCards"></div>
    </section>

    <section class="section" id="ps4Section">
      <div class="section-head">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><path d="M8.5 18.5 6 7.5l3-2 3 2 3-2 3 2-2.5 11"/><path d="M9 10h6"/></svg>
          <div><h2>PS4 <small style="display:inline;font-size:13px">(Todos)</small></h2><small>Informações gerais encontradas pelo monitoramento</small></div>
        </div>
        <span class="pill">TODOS</span>
      </div>
      <div class="cards" id="ps4Cards"></div>
    </section>

    <section class="section" id="advanceSection">
      <div class="section-head">
        <div class="section-title">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/><path d="m17 6 1 3"/></svg>
          <div><h2>14.00 <small style="display:inline;font-size:13px">(Só avanços)</small></h2><small>Apenas novidades e progresso real</small></div>
        </div>
        <span class="pill purple">AVANÇOS</span>
      </div>
      <div class="cards" id="advanceCards"></div>
    </section>

  </main>
</div>

<nav class="bottom">
  <button class="nav active" data-nav="home">
    <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Início</span>
  </button>
  <button class="nav" data-nav="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
    <span>Pesquisar</span>
  </button>
  <button class="nav" data-nav="radar">
    <svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M7 13a5 5 0 0 1 10 0"/><circle cx="12" cy="13" r="1.5"/><path d="M12 13 18 7"/></svg>
    <span>Radar</span>
  </button>
  <button class="nav" data-nav="settings">
    <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="5"/></svg>
    <span>Configurações</span>
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

let radarData = {
  target_firmware: "14.00",
  items: [],
  new_items: [],
  new_items_this_run: 0
};

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function icon(type){
  if(type === "advance") return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12 18 6"/><path d="m17 6 1 3"/></svg>`;
  return `<svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M7 13a5 5 0 0 1 10 0"/><circle cx="12" cy="13" r="1.5"/><path d="M12 13 18 7"/></svg>`;
}

function ago(date){
  if(!date) return "";
  const d = new Date(date);
  if(Number.isNaN(d.getTime())) return "";
  const sec = Math.max(0, Math.floor((Date.now()-d.getTime())/1000));
  if(sec < 3600) return `há ${Math.max(1,Math.floor(sec/60))} min`;
  if(sec < 86400) return `há ${Math.floor(sec/3600)} h`;
  return `há ${Math.floor(sec/86400)} d`;
}

function makeCard(item, mode, index){
  const title = escapeHtml(item.title || "Resultado PS4 14.00");
  const summary = escapeHtml(item.summary || "Resultado encontrado pelo Radar.");
  const url = escapeHtml(item.url || "#");
  const reasons = Array.isArray(item.reasons) ? item.reasons : ["PS4","14.00"];
  const tags = reasons.slice(0,3).map(x => `<span class="tag">${escapeHtml(x)}</span>`).join("");
  const isNew = index === 0 && radarData.new_items_this_run > 0;
  const label = isNew
    ? `<span class="label new">★ NOVO</span>`
    : mode === "advance"
      ? `<span class="label advance">AVANÇO</span>`
      : `<span class="label radar">RADAR</span>`;

  return `
    <a class="card ${isNew ? "new":""} ${mode === "advance" ? "advance":""}" href="${url}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">
      <div class="card-icon">${icon(mode)}</div>
      <div class="card-body">
        ${label}
        <div class="card-title">${title}</div>
        <div class="card-summary">${summary}</div>
        <div class="meta">${tags}</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  `;
}

function empty(target, title, text){
  $(target).innerHTML = `<div class="empty"><strong>${escapeHtml(title)}</strong>${escapeHtml(text)}</div>`;
}

function render(){
  const items = Array.isArray(radarData.items) ? radarData.items : [];
  const advances = items.filter(item => {
    const text = JSON.stringify(item).toLowerCase();
    return /advance|avan[cç]o|exploit|jailbreak|kernel|webkit|vulnerability|primitive|offset|payload|hen|goldhen/.test(text);
  });

  const radar = items.slice(0,3);
  const ps4 = items.slice(0,2);
  const advance = advances.slice(0,2);

  if(radar.length){
    $("#radarCards").innerHTML = radar.map((x,i)=>makeCard(x,"radar",i)).join("");
  } else {
    empty("#radarCards","Radar funcionando","Nenhum resultado PS4 14.00 disponível nesta atualização.");
  }

  if(ps4.length){
    $("#ps4Cards").innerHTML = ps4.map((x,i)=>makeCard(x,"ps4",i)).join("");
  } else {
    empty("#ps4Cards","Aguardando informações","O Radar ainda não encontrou conteúdo suficiente para esta seção.");
  }

  if(advance.length){
    $("#advanceCards").innerHTML = advance.map((x,i)=>makeCard(x,"advance",i)).join("");
  } else {
    empty("#advanceCards","Nenhum avanço novo","Ainda não há um resultado classificado como avanço.");
  }

  $("#radarStatus").textContent = radarData.new_items_this_run > 0
    ? `● ${radarData.new_items_this_run} NOVO${radarData.new_items_this_run > 1 ? "S":""}`
    : "● ATIVO";
}

async function loadRadar(){
  try{
    const response = await fetch("./radar/radar.json?ts=" + Date.now(), {cache:"no-store"});
    if(!response.ok) throw new Error("radar.json não encontrado");
    radarData = await response.json();
    render();
  }catch(error){
    console.warn(error);
    render();
  }
}

function toast(message){
  const el = $("#toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast = setTimeout(()=>el.classList.remove("show"),1800);
}

function setTheme(theme){
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("ps4-theme",theme);
}

const savedTheme = localStorage.getItem("ps4-theme") || "blue";
setTheme(savedTheme === "black" ? "black" : "blue");

$("#themeBtn").addEventListener("click",()=>{
  const next = document.documentElement.dataset.theme === "black" ? "blue" : "black";
  setTheme(next);
  toast(next === "black" ? "Tema Full Black" : "Tema Azul");
});

$("#searchBtn").addEventListener("click",()=>{
  toast("Pesquisa será ligada aos resultados do Radar");
});

$$(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    $$(".tab").forEach(x=>x.classList.remove("active"));
    button.classList.add("active");

    const target = button.dataset.tab;
    document.getElementById(
      target === "radar" ? "radarSection" :
      target === "ps4" ? "ps4Section" : "advanceSection"
    ).scrollIntoView({behavior:"smooth",block:"start"});
  });
});

$$(".nav").forEach(button=>{
  button.addEventListener("click",()=>{
    $$(".nav").forEach(x=>x.classList.remove("active"));
    button.classList.add("active");

    const target = button.dataset.nav;

    if(target === "home") window.scrollTo({top:0,behavior:"smooth"});
    if(target === "radar") $("#radarSection").scrollIntoView({behavior:"smooth"});
    if(target === "search") toast("Pesquisa será ligada aos resultados");
    if(target === "settings") {
      const next = document.documentElement.dataset.theme === "black" ? "blue" : "black";
      setTheme(next);
      toast(next === "black" ? "Tema Full Black" : "Tema Azul");
    }
  });
});

loadRadar();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(console.warn);
  });
}
</script>
</body>
</html>
